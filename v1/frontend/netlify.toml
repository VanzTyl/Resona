# ========================================
# Resona Frontend — Netlify Configuration
# ========================================

[build]
  # Publish directory (where index.html lives)
  publish = "src"

  # No build command needed — pure static HTML/CSS/JS

# === Redirects for SPA support ===
# Hash-based routing (#/feed, #/login) works without this,
# but it's here for future non-hash routes and direct URL access
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# === Security headers ===
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
