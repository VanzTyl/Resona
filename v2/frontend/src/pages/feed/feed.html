<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resona — Feed</title>
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="styles/feed.css">
</head>
<body>
    <!-- v3.0: 'The Living Feed' — vibrant three-zone music community feed -->
    <div id="page-feed" class="page page--active">
        <header class="page__header">
            <div class="page__header-brand">
                <span class="page__header-logo" aria-hidden="true">
                    <span class="page__header-logo-bar"></span>
                    <span class="page__header-logo-bar"></span>
                    <span class="page__header-logo-bar"></span>
                </span>
                <h1 class="page__title">Feed</h1>
            </div>
        </header>
        <main class="page__content" id="feed-content">
            <!-- Zone 1: Now Playing Strip -->
            <div id="feed-now-playing" class="feed-now-playing-strip" style="display: none;">
                <div class="feed-now-playing-strip__fade feed-now-playing-strip__fade--left"></div>
                <div class="feed-now-playing-strip__track" id="feed-now-playing-track">
                    <!-- JS populates .now-playing-friends__item elements -->
                </div>
                <div class="feed-now-playing-strip__fade feed-now-playing-strip__fade--right"></div>
            </div>

            <!-- Zone 2: Feed Cards -->
            <div id="feed-container"></div>
            <div id="feed-skeleton-container" class="rs-skeleton">
                <div class="feed-card feed-card--skeleton">
                    <div class="feed-card__header">
                        <div class="rs-skeleton__item rs-skeleton__item--circle" style="width: 40px; height: 40px;"></div>
                        <div class="rs-skeleton__group">
                            <div class="rs-skeleton__item rs-skeleton__item--text" style="width: 60%;"></div>
                            <div class="rs-skeleton__item rs-skeleton__item--text" style="width: 40%;"></div>
                        </div>
                    </div>
                    <div class="rs-skeleton__item rs-skeleton__item--rectangle" style="height: 200px;"></div>
                    <div style="padding: 16px;">
                        <div class="rs-skeleton__item rs-skeleton__item--text" style="width: 70%;"></div>
                        <div class="rs-skeleton__item rs-skeleton__item--text" style="width: 50%; margin-top: 8px;"></div>
                    </div>
                </div>
                <div class="feed-card feed-card--skeleton">
                    <div class="feed-card__header">
                        <div class="rs-skeleton__item rs-skeleton__item--circle" style="width: 40px; height: 40px;"></div>
                        <div class="rs-skeleton__group">
                            <div class="rs-skeleton__item rs-skeleton__item--text" style="width: 60%;"></div>
                            <div class="rs-skeleton__item rs-skeleton__item--text" style="width: 40%;"></div>
                        </div>
                    </div>
                    <div class="rs-skeleton__item rs-skeleton__item--rectangle" style="height: 200px;"></div>
                    <div style="padding: 16px;">
                        <div class="rs-skeleton__item rs-skeleton__item--text" style="width: 70%;"></div>
                        <div class="rs-skeleton__item rs-skeleton__item--text" style="width: 50%; margin-top: 8px;"></div>
                    </div>
                </div>
                <div class="feed-card feed-card--skeleton">
                    <div class="feed-card__header">
                        <div class="rs-skeleton__item rs-skeleton__item--circle" style="width: 40px; height: 40px;"></div>
                        <div class="rs-skeleton__group">
                            <div class="rs-skeleton__item rs-skeleton__item--text" style="width: 60%;"></div>
                            <div class="rs-skeleton__item rs-skeleton__item--text" style="width: 40%;"></div>
                        </div>
                    </div>
                    <div class="rs-skeleton__item rs-skeleton__item--rectangle" style="height: 200px;"></div>
                    <div style="padding: 16px;">
                        <div class="rs-skeleton__item rs-skeleton__item--text" style="width: 70%;"></div>
                        <div class="rs-skeleton__item rs-skeleton__item--text" style="width: 50%; margin-top: 8px;"></div>
                    </div>
                </div>
            </div>

            <!-- Zone 3: Empty State -->
            <div id="feed-empty-state" class="empty-state" style="display: none;">
                <div class="empty-state__illustration feed-empty-illustration">
                    <div class="feed-empty-illustration__vinyl"></div>
                </div>
                <h2 class="empty-state__title">Your feed is quiet</h2>
                <p class="empty-state__text">Add friends to fill it with music</p>
            </div>

            <!-- Zone 4: Discover -->
            <div id="feed-discover-section" style="display: none;"></div>

            <!-- Sentinel -->
            <div id="feed-sentinel" style="height: 1px;"></div>
        </main>
    </div>
    <script src="../../globals/components/api-client.js"></script>
    <script src="../../globals/components/icons.js"></script>
    <script src="../../globals/components/theme.js"></script>
    <script src="../../globals/components/button.js"></script>
    <script src="../../globals/components/modal.js"></script>
    <script src="../../globals/components/toast.js"></script>
    <script src="../../globals/components/skeleton-loader.js"></script>
    <script src="../../globals/components/feed-card.js"></script>
    <script src="../../sidebar.js"></script>
    <script src="../../script.js"></script>
    <script src="feed.js"></script>
</body>
</html>
