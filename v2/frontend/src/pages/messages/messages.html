<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resona — Messages</title>
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="styles/messages.css">
</head>
<body>
    <!-- v3.0: 'The Listening Lounge' — intimate music chat experience -->
    <div id="page-messages" class="page page--active">
        <header class="page__header">
            <h1 class="page__title">Messages</h1>
        </header>
        <main class="page__content" id="messages-content">
            <!-- Thread List -->
            <div id="messages-thread-list"></div>

            <!-- Empty State -->
            <div id="messages-empty-state" class="empty-state">
                <div class="empty-state__illustration messages-empty-illustration">
                    <div class="messages-empty-illustration__vinyl"></div>
                    <div class="messages-empty-illustration__bubble"></div>
                </div>
                <h2 class="empty-state__title">Your conversations live here</h2>
                <p class="empty-state__text">React to a friend's music to start chatting!</p>
            </div>

            <!-- Chat Pane -->
            <div id="messages-chat-pane" style="display: none;">
                <div id="messages-chat-header" class="page__header messages-chat-header">
                    <!-- JS sets textContent to friend name -->
                </div>
                <div id="messages-chat-thread" class="chat-thread"></div>
                <div id="messages-chat-input" class="chat-input">
                    <textarea class="chat-input__field" id="chat-input-field"
                              placeholder="Type a message..." rows="1"></textarea>
                    <button class="rs-btn rs-btn--primary rs-btn--icon-circle" id="chat-send-btn"
                            aria-label="Send message">
                        <span data-lucide="send" class="rs-icon"></span>
                    </button>
                </div>
            </div>
        </main>
    </div>
    <script src="../../globals/components/api-client.js"></script>
    <script src="../../globals/components/icons.js"></script>
    <script src="../../globals/components/theme.js"></script>
    <script src="../../globals/components/button.js"></script>
    <script src="../../globals/components/modal.js"></script>
    <script src="../../globals/components/toast.js"></script>
    <script src="../../globals/components/skeleton-loader.js"></script>
    <script src="../../sidebar.js"></script>
    <script src="../../script.js"></script>
    <script src="messages.js"></script>
</body>
</html>
