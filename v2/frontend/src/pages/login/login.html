<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resona — Login</title>
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="styles/login.css">
</head>
<body>
    <!-- v2.2: Page with atmospheric background, glassmorphism card wrapper -->
    <div id="page-login" class="page page--centered page--active">
        <div class="login-card__wrapper">
            <div class="login-page">
                <div class="login-page__logo" data-lucide="music" style="width: 64px; height: 64px; color: var(--rs-primary);"></div>
                <h1 class="login-page__title">Resona</h1>
                <p class="login-page__subtitle">Music is the conversation — not the destination. Connect your Spotify to see what your friends are listening to right now.</p>
                <div id="login-btn-container">
                    <!-- Login button will be appended here by login.js -->
                </div>
            </div>
        </div>
    </div>
    <script src="../../globals/components/api-client.js"></script>
    <script src="../../globals/components/icons.js"></script>
    <script src="../../globals/components/theme.js"></script>
    <script src="../../globals/components/button.js"></script>
    <script src="../../globals/components/modal.js"></script>
    <script src="../../globals/components/toast.js"></script>
    <script src="../../sidebar.js"></script>
    <script src="../../script.js"></script>
    <script src="login.js"></script>
</body>
</html>
